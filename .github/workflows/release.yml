name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  # v0.1.1 shipped assets named 0.1.0 because the tag was bumped and
  # project(VERSION) was not. Catch that before anything is built.
  check-version:
    name: Tag matches project version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(sed -n 's/^project(SonyDeviceCenter VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=$tag project=$proj"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match project(VERSION $proj) in CMakeLists.txt"
            exit 1
          fi

  linux:
    name: Linux packages (DEB, RPM, TGZ)
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake rpm \
            libbluetooth-dev libdbus-1-dev \
            libglew-dev libglfw3-dev libgl1-mesa-dev \
            qt6-base-dev qt6-declarative-dev

      # Packaging builds do not run the suite, so tests are left out of the
      # configure entirely rather than built and skipped.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DBUILD_TESTING=OFF -DSONY_REQUIRE_QT=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: cd build && cpack -G "DEB;RPM;TGZ"

      - name: Collect
        run: |
          mkdir -p dist
          cp build/*.deb build/*.rpm build/*.tar.gz dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/

  windows:
    name: Windows installer (MSI, ZIP)
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # qtdeclarative ships inside the Qt 6 desktop base archive; naming it as
      # an optional module makes aqtinstall fail with "not available".
      # Floor, not a wildcard: 6.8.3 shipped in v0.1.1/v0.1.2 and is affected by
      # CVE-2025-12385 (fixed 6.8.6) and CVE-2025-10729 (fixed 6.8.5).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '>=6.8.6 <6.9.0'
          arch: 'win64_msvc2022_64'

      # CPack's WIX generator drives candle.exe/light.exe, which only exist in
      # WiX 3 - WiX 4+ replaced them with a different CLI. Install it if the
      # runner image does not already carry it.
      - name: Ensure WiX 3 is available
        shell: pwsh
        run: |
          function Find-Wix {
            Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset*' -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name | Select-Object -Last 1
          }
          $wix = Find-Wix
          if (-not $wix) {
            Write-Host 'WiX 3 not present on the image; installing via chocolatey'
            choco install wixtoolset --version=3.14.1 -y --no-progress
            $wix = Find-Wix
          }
          if (-not $wix) { throw 'WiX 3 could not be installed' }
          $bin = Join-Path $wix.FullName 'bin'
          if (-not (Test-Path (Join-Path $bin 'candle.exe'))) {
            throw "candle.exe not found under $bin"
          }
          Write-Host "Using $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DBUILD_TESTING=OFF \
                -DSONY_REQUIRE_QT=ON -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"

      - name: Build
        shell: bash
        run: cmake --build build --config ${BUILD_TYPE} --parallel

      - name: Package
        shell: bash
        run: cd build && cpack -C ${BUILD_TYPE} -G "WIX;ZIP"

      # v0.1.0 shipped an app that could not start because the MSVC runtime
      # was missing. Assert on the produced archive so that fails the build
      # here instead of on a user's desktop.
      - name: Verify the package is self-contained
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem build/*.zip | Select-Object -First 1
          if (-not $zip) { throw 'no ZIP produced' }
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = $archive.Entries.Name
          $required = @(
            'sony-device-center.exe', 'sonyd.exe', 'sonyctl.exe',
            'Qt6Core.dll', 'Qt6Quick.dll', 'Qt6QuickControls2.dll',
            'MSVCP140.dll', 'VCRUNTIME140.dll', 'VCRUNTIME140_1.dll'
          )
          $missing = $required | Where-Object { $names -notcontains $_ }
          $archive.Dispose()
          if ($missing) { throw "missing from $($zip.Name): $($missing -join ', ')" }
          Write-Host "$($zip.Name) contains all required binaries and runtime"

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp build/*.msi build/*.zip dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      # --generate-notes on its own produces a bare PR changelog and silently
      # ignores the annotated tag message, so the notes are assembled here:
      # a maintained header plus GitHub's generated changelog.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > generated.md
          cat .github/release-notes-header.md generated.md > notes.md
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md
          fi
