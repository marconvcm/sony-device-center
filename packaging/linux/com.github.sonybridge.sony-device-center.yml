app-id: com.github.sonybridge.sony-device-center
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: sony-device-center

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=all
  - --system-talk-name=org.bluez

modules:
  - name: sony-device-center
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
