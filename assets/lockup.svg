    <circle cx="4.6" cy="16" r="2.6" fill="#FFFFFF" stroke="none"/>
    <circle cx="19" cy="16" r="2.2" stroke-width="1.7"/>
  </g>

  <!-- Wordmark -->
  <text x="54" y="23"
        font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
        font-size="16" font-weight="600" letter-spacing="-0.3"
        fill="#F4F6FA">Device Center</text>
  <text x="54" y="37"
        font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
        font-size="9.5" font-weight="700" letter-spacing="1.4"
        fill="#5C6473">SONY AUDIO</text>
