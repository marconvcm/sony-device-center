<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" width="260" height="48"
     role="img" aria-label="Device Center — Sony Audio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Device Center — Sony Audio</title>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>

  <!-- Mark in its tile -->
  <rect x="0" y="4" width="40" height="40" rx="13" fill="url(#tile)"/>
  <g transform="translate(6.667 10.667) scale(1.1111)"
