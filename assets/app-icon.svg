<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Device Center" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Device Center</title>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#A78BFA"/>
      <stop offset="1"   stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect width="512" height="512" rx="114" fill="url(#sheen)"/>

  <!-- Mark scaled from the 24-unit grid: 512 * 0.62 / 24 = 13.23 -->
  <g transform="translate(97.28 97.28) scale(13.2267)"
     fill="none" stroke="#FFFFFF">
    <path d="M4.6 13.2 A7.2 7.2 0 0 1 19 13.2"
          stroke-width="2" stroke-linecap="round"/>
    <circle cx="4.6" cy="16" r="2.6" fill="#FFFFFF" stroke="none"/>
    <circle cx="19" cy="16" r="2.2" stroke-width="1.7"/>
  </g>
</svg>
