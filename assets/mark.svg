<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" role="img" aria-label="Device Center" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Device Center</title>

  <!-- Headband -->
  <path d="M4.6 13.2 A7.2 7.2 0 0 1 19 13.2"
        stroke-width="2" stroke-linecap="round"/>

  <!-- Left earcup: sealed (noise cancelling) -->
  <circle cx="4.6" cy="16" r="2.6" fill="currentColor" stroke="none"/>

  <!-- Right earcup: open (ambient) -->
  <circle cx="19" cy="16" r="2.2" stroke-width="1.7"/>
</svg>
